    <rect x="190" y="100" width="120" height="70" rx="8" fill="#123A5A"/><text x="200" y="190">#123A5A Navy800</text>
    <rect x="340" y="100" width="120" height="70" rx="8" fill="#1F5A82"/><text x="350" y="190">#1F5A82 Navy700</text>
